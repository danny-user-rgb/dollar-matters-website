<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="260" height="45">
  <!-- Dollar bill icon -->
  <g transform="translate(0, 5)">
    <!-- Bill body - slightly rotated/dynamic shape -->
    <path d="M12,6 L78,0 Q88,0 88,10 L88,62 Q88,72 78,72 L12,78 Q2,78 2,68 L2,16 Q2,6 12,6 Z" fill="#000"/>
    <!-- Wavy lines left side -->
    <path d="M10,20 Q14,22 10,24 Q14,26 10,28" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M10,32 Q14,34 10,36 Q14,38 10,40" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M10,44 Q14,46 10,48 Q14,50 10,52" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Wavy lines right side -->
    <path d="M80,20 Q76,22 80,24 Q76,26 80,28" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M80,32 Q76,34 80,36 Q76,38 80,40" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M80,44 Q76,46 80,48 Q76,50 80,52" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Oval frame around $ -->
    <ellipse cx="45" cy="39" rx="18" ry="22" fill="none" stroke="white" stroke-width="2"/>
    <!-- Dollar sign -->
    <text x="45" y="47" font-size="26" font-weight="900" fill="white" text-anchor="middle" font-family="Arial, sans-serif">$</text>
  </g>
  <!-- Dollar Matters text -->
  <text x="105" y="67" font-size="58" font-weight="900" fill="#000" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" letter-spacing="-1">Dollar Matters</text>
</svg>
